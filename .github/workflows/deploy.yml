name: Build Image and Deploy to Dokploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            build_args: ""
          # Vite inlines VITE_API_BASE_URL at build time. Set the repository
          # variable VITE_API_BASE_URL (Settings > Secrets and variables >
          # Actions > Variables) to the public API origin.
          - service: frontend
            context: ./frontend
            build_args: |
              VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trigger Dokploy Deployment
        env:
          SERVICE: ${{ matrix.service }}
          WEBHOOK_BACKEND: ${{ secrets.DOKPLOY_WEBHOOK_URL_BACKEND }}
          WEBHOOK_FRONTEND: ${{ secrets.DOKPLOY_WEBHOOK_URL_FRONTEND }}
        run: |
          url=""
          case "$SERVICE" in
            backend) url="$WEBHOOK_BACKEND" ;;
            frontend) url="$WEBHOOK_FRONTEND" ;;
          esac

          if [ -z "$url" ]; then
            echo "::warning::No Dokploy webhook secret for '$SERVICE' (DOKPLOY_WEBHOOK_URL_$(echo "$SERVICE" | tr a-z A-Z)). Image pushed to GHCR only."
            exit 0
          fi

          # Body is written to a file and never printed: the response can echo the
          # webhook path, which is the deploy token.
          body_file="$(mktemp)"
          status=$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
            --retry 2 --retry-delay 5 --retry-connrefused --max-time 60 \
            -X POST "$url" \
            -H "Content-Type: application/json") || status=000

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Dokploy accepted the $SERVICE deployment (HTTP $status)."
            rm -f "$body_file"
            exit 0
          fi

          echo "::error::Dokploy webhook for $SERVICE returned HTTP $status."
          if grep -qi 'challenge-platform\|Just a moment' "$body_file" 2>/dev/null; then
            echo "::error::Cloudflare answered with a challenge page, not Dokploy. Allow /api/deploy/* through the zone's WAF, or point the secret at a hostname that is DNS-only."
          fi
          rm -f "$body_file"
          exit 1
