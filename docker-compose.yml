services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: agrinexus_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agrinexus_db}
      MYSQL_USER: ${MYSQL_USER:-agrinexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agrinexus_secret_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agrinexus_root_password}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-agrinexus_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PHP Backend API Service
  backend:
    # Built and pushed by .github/workflows/deploy.yml.
    image: ghcr.io/vincent0-ai/agrinexus-backend:latest
    pull_policy: always
    container_name: agrinexus_backend
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-agrinexus_db}
      DB_USER: ${MYSQL_USER:-agrinexus}
      DB_PASS: ${MYSQL_PASSWORD:-agrinexus_secret_password}
      DB_CHARSET: utf8mb4
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_change_me_in_prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-""}
    expose:
      - "80"
    volumes:
      - backend_uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  # React / Vite Frontend Service
  frontend:
    # VITE_API_BASE_URL is baked into the bundle by CI (repository variable),
    # not at deploy time.
    image: ghcr.io/vincent0-ai/agrinexus-frontend:latest
    pull_policy: always
    container_name: agrinexus_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local
